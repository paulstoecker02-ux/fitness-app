    draftGroup=existing&&maxLoad(existing,groupById(state.current))?state.current:draft.home;
    $('exercise-dialog').innerHTML=`<form class="sheet" id="exercise-form">${sheetHead(existing?'Übung bearbeiten':'Eigene Übung','exercise-dialog-title')}<div class="sheet-body"><label class="field"><span class="field-label">Name der Übung</span><input id="edit-name" maxlength="200" required placeholder="z. B. meine Lieblingsübung" value="${esc(draft.name)}" autocomplete="off"></label><label class="field"><span class="field-label">Dein Text / Ausführung</span><textarea id="edit-cue" maxlength="6000" placeholder="Schreib hier, was du dir merken willst …">${esc(draft.cue)}</textarea></label><label class="field"><span class="field-label">Gewicht, Wiederholungen oder eigene Notiz</span><input id="edit-ref" maxlength="1000" value="${esc(draft.reference)}" placeholder="z. B. 60 kg · 2 × 10"></label><div class="two-fields"><label class="field"><span class="field-label">Im Repertoire unter</span><select id="edit-home">${state.groups.map(g=>`<option value="${esc(g.id)}" ${g.id===draft.home?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><label class="field"><span class="field-label">Gerät / Equipment</span><input id="edit-equipment" maxlength="100" value="${esc(draft.equipment)}" placeholder="Frei eintragen"></label></div><label class="check-label"><input type="checkbox" id="edit-known" ${draft.known?'checked':''}>Diese Übung kenne ich bereits</label><section class="editor-section"><h3>Den Kreis selbst ausfüllen</h3><p class="help-text">Pro Bereich wählen: aus, leicht, mittel oder stark. Über die Gruppenauswahl kannst du auch Mitbelastungen eintragen.</p><label class="field"><span class="field-label">Belastung für diese Muskelgruppe</span><select id="load-group">${state.groups.map(g=>`<option value="${esc(g.id)}" ${g.id===draftGroup?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><div id="draft-load-editor"></div><div id="draft-assigned" class="assigned-groups"></div></section></div><div class="sheet-footer">${existing?`<button type="button" class="icon-button danger" id="delete-exercise" aria-label="Übung löschen">${icon('trash')}</button><button type="button" class="soft-button" id="duplicate-exercise">Kopie</button>`:'<button type="button" class="soft-button" data-close>Abbrechen</button>'}<button class="primary-button" type="submit">${icon('check')}Speichern</button></div></form>`;
    $('exercise-dialog').querySelectorAll('button').forEach(b=>{if(!b.hasAttribute('type'))b.type='button';});
    ['name','cue'].forEach(key=>$('edit-'+key).oninput=e=>draft[key]=e.target.value);
    $('edit-ref').oninput=e=>draft.reference=e.target.value;
    $('edit-equipment').oninput=e=>draft.equipment=e.target.value;
    $('edit-known').onchange=e=>draft.known=e.target.checked;
    $('edit-home').onchange=e=>{draft.home=e.target.value;draftGroup=draft.home;$('load-group').value=draftGroup;renderDraftLoads();};
    $('load-group').onchange=e=>{draftGroup=e.target.value;renderDraftLoads();};
    $('exercise-form').onsubmit=e=>{e.preventDefault();saveExercise();};
    if(existing){
      $('delete-exercise').onclick=()=>ask('Übung löschen?',`„${draft.name}“ wird aus deinem Repertoire und deiner Auswahl entfernt.`,()=>{state.exercises=state.exercises.filter(e=>e.id!==draft.id);state.selected=state.selected.filter(id=>id!==draft.id);$('exercise-dialog').close();persist();render();notify('Übung gelöscht.');},'Löschen');
      $('duplicate-exercise').onclick=()=>{draft.id=uid('exercise');draft.name=(draft.name+' · Kopie').slice(0,200);draft.source='own';$('edit-name').value=draft.name;$('exercise-dialog-title').textContent='Übung kopieren';$('delete-exercise').classList.add('hidden');$('duplicate-exercise').classList.add('hidden');notify('Kopie bearbeiten und speichern.');};
    }
    renderDraftLoads();show($('exercise-dialog'));
    // Avoid automatically summoning the iPhone keyboard for an existing exercise.
    if(existing){$('exercise-dialog').querySelector('[data-close]').focus({preventScroll:true});}
  }
  function renderDraftLoads(){
    const g=groupById(draftGroup);
    $('draft-load-editor').innerHTML=`<div class="draft-preview"><div class="draft-preview-ring">${ring(g,[draft],{interactive:'paint'})}</div><div class="draft-preview-text"><strong>Tippe in ein Kreissegment.</strong><br>Es wechselt aus → leicht → mittel → stark. Unten kannst du direkt wählen.</div></div>${g.segments.map(s=>`<div class="level-row"><div class="level-title"><span class="color-dot" style="--swatch:${esc(s.color)}"></span>${esc(s.name)}</div><div class="levels" role="group" aria-label="Belastung ${esc(s.name)}">${[0,1,2,3].map(v=>`<button type="button" class="level-button ${(draft.loads[s.id]||0)===v?'active':''}" data-load-segment="${esc(s.id)}" data-level="${v}" aria-pressed="${(draft.loads[s.id]||0)===v}" aria-label="${esc(s.name)} ${LEVELS[v]}"><span class="level-color" style="background:${v?s.color:'#E1E7DE'};opacity:${v?ALPHA[v]:1}"></span>${LEVELS[v]}</button>`).join('')}</div></div>`).join('')}`;
    $('draft-assigned').innerHTML=state.groups.filter(x=>maxLoad(draft,x)>0).map(x=>`<button type="button" class="assigned-chip ${x.id===draftGroup?'active':''}" data-draft-group="${esc(x.id)}">${esc(x.name)} · ${x.segments.filter(s=>draft.loads[s.id]).length}</button>`).join('');
  }
  function setDraftLoad(id,level){if(level>0)draft.loads[id]=level;else delete draft.loads[id];renderDraftLoads();}
  function saveExercise(){
    if(!draft.name.trim()){notify('Bitte einen Übungsnamen eintragen.');$('edit-name').focus();return;}
    draft.name=draft.name.trim();
    const apply=()=>{const index=state.exercises.findIndex(e=>e.id===draft.id);if(index>=0)state.exercises[index]=clone(draft);else state.exercises.push(clone(draft));state.current=draft.home;state.view='group';search='';$('exercise-dialog').close();persist();render();notify('Übung gespeichert.');};
    if(!Object.keys(draft.loads).length){ask('Ohne Farbe speichern?','Die Übung wird gespeichert, trägt aber noch zu keinem Muskelkreis bei.',apply,'Trotzdem speichern');return;}
    apply();
  }
  function openGroupEditor(id){
    groupDraft=id?clone(groupById(id)):{id:uid('group'),name:'',zone:'Eigene',about:'Eigene Trainingsbereiche.',note:'',segments:[{id:uid('segment'),name:'Bereich 1',color:COLORS[0]},{id:uid('segment'),name:'Bereich 2',color:COLORS[1]},{id:uid('segment'),name:'Bereich 3',color:COLORS[2]}]};
    groupInitial=JSON.stringify(groupDraft);
    $('group-dialog').innerHTML=`<form class="sheet" id="group-form">${sheetHead(id?'Bereiche & Farben':'Eigene Muskelgruppe','group-dialog-title')}<div class="sheet-body"><label class="field"><span class="field-label">Name der Muskelgruppe</span><input id="group-name-input" required maxlength="100" value="${esc(groupDraft.name)}" placeholder="Muskelgruppe"></label><label class="field"><span class="field-label">Kategorie</span><select id="group-zone-input">${[...new Set(['Oberkörper','Arme','Rumpf','Unterkörper','Eigene',groupDraft.zone])].map(z=>`<option ${z===groupDraft.zone?'selected':''}>${esc(z)}</option>`).join('')}</select></label><h3>Kreissegmente</h3><p class="help-text">Namen frei ändern. Auf die Farbfläche tippen, um die Farbe für diesen Bereich in allen Übungen zu ändern.</p><div id="segment-edit-list"></div><button class="text-button" id="add-segment" type="button">${icon('plus')}Bereich hinzufügen</button><div id="color-preview"></div><p class="help-text" style="margin-top:14px">1–6 Bereiche pro Gruppe. Deine Übungszuordnungen bleiben beim Umbenennen und Umfärben erhalten.</p></div><div class="sheet-footer"><button type="button" class="soft-button" data-close>Abbrechen</button><button class="primary-button" type="submit">${icon('check')}Speichern</button></div></form>`;
    $('group-dialog').querySelectorAll('button').forEach(b=>{if(!b.hasAttribute('type'))b.type='button';});
    $('group-name-input').oninput=e=>groupDraft.name=e.target.value;
    $('group-zone-input').onchange=e=>groupDraft.zone=e.target.value;
    $('add-segment').onclick=()=>{if(groupDraft.segments.length>=6)return;groupDraft.segments.push({id:uid('segment'),name:'Neuer Bereich',color:COLORS[groupDraft.segments.length]});renderGroupSegments();};
    $('group-form').onsubmit=e=>{e.preventDefault();saveGroup();};
    renderGroupSegments();show($('group-dialog'));if(id)$('group-dialog').querySelector('[data-close]').focus({preventScroll:true});
  }
  function renderColorPreview(){
    const demo={loads:{}};groupDraft.segments.forEach((s,i)=>demo.loads[s.id]=(i%3)+1);
    $('color-preview').innerHTML=`<div class="color-demo"><div class="ring-wrap">${ring(groupDraft,[demo])}</div><p>Vorschau mit wechselnden Stufen 1, 2, 3.<br>Die Belastung stellst du separat bei jeder Übung ein.</p></div>`;
  }
  function renderGroupSegments(){
    $('segment-edit-list').innerHTML=groupDraft.segments.map(s=>`<div class="segment-edit-row"><input type="color" data-seg-color="${esc(s.id)}" value="${esc(s.color)}" aria-label="Farbe ${esc(s.name)}"><input type="text" data-seg-name="${esc(s.id)}" maxlength="100" value="${esc(s.name)}" aria-label="Bereichsname"><button class="icon-button" type="button" data-delete-segment="${esc(s.id)}" aria-label="${esc(s.name)} entfernen" ${groupDraft.segments.length<=1?'disabled':''}>${icon('close')}</button></div>`).join('');
    $('add-segment').disabled=groupDraft.segments.length>=6;renderColorPreview();
  }
  function saveGroup(){
    if(!groupDraft.name.trim()){notify('Bitte Gruppennamen eintragen.');return;}
    groupDraft.name=groupDraft.name.trim();groupDraft.segments.forEach((s,i)=>s.name=s.name.trim()||'Bereich '+(i+1));
    const old=groupById(groupDraft.id),removed=old?old.segments.filter(s=>!groupDraft.segments.some(n=>n.id===s.id)):[];
    const apply=()=>{const index=state.groups.findIndex(g=>g.id===groupDraft.id);if(index<0)state.groups.push(clone(groupDraft));else state.groups[index]=clone(groupDraft);removed.forEach(s=>state.exercises.forEach(e=>delete e.loads[s.id]));state.current=groupDraft.id;state.view='group';$('group-dialog').close();persist();render();notify('Muskelgruppe gespeichert.');};
    if(removed.length)ask('Bereiche entfernen?',`Die Belastungszuordnungen für ${removed.map(s=>s.name).join(', ')} werden aus allen Übungen entfernt.`,apply,'Speichern & entfernen');else apply();
  }
  function openSegment(id){
    const g=state.groups.find(x=>x.segments.some(s=>s.id===id));if(!g)return;const s=g.segments.find(x=>x.id===id),items=contributions(s),level=maxLevel(s);
    const totalAlpha=1-items.reduce((v,e)=>v*(1-ALPHA[e.loads[s.id]]),1);
    $('segment-dialog').innerHTML=`<div class="sheet">${sheetHead(s.name,'segment-dialog-title','ÜBERLAGERUNG IM DETAIL')}<div class="sheet-body"><div class="draft-preview"><span style="display:block;width:64px;height:64px;border-radius:50%;background:#E1E7DE;flex-shrink:0"><span style="display:block;width:64px;height:64px;border-radius:50%;background:${esc(s.color)};opacity:${totalAlpha}"></span></span><div class="draft-preview-text"><strong>${items.length} ${items.length===1?'Beitrag':'Beiträge'}</strong><br>Höchste einzelne Stufe: ${LEVELS[level]}<br>${level<2?'Noch kein mittlerer/starker Beitrag.':'Mindestens ein mittlerer/starker Beitrag.'}</div></div>${items.map(e=>`<div class="segment-detail-row"><div><strong>${esc(e.name)}</strong><span>${LEVELS[e.loads[s.id]]} beteiligt</span></div>${bars(e.loads[s.id],s.color)}<button class="icon-button" data-detail-edit="${esc(e.id)}" aria-label="${esc(e.name)} bearbeiten">${icon('edit')}</button></div>`).join('')||'<div class="empty">Noch keine Übung für diesen Bereich ausgewählt.</div>'}<p class="help-text" style="margin-top:16px">Jede ausgewählte Übung legt eine eigene halbtransparente Farbschicht darüber. Mehrere Beiträge wirken dadurch satter. Das ist eine Darstellung deiner Zuordnung — keine Berechnung von Muskelwachstum oder Belastbarkeit.</p></div></div>`;show($('segment-dialog'));
  }
  function openSettings(){
    $('settings-dialog').innerHTML=`<div class="sheet">${sheetHead('Daten & Hilfe','settings-dialog-title')}<div class="sheet-body"><p class="help-text">${state.exercises.length} Übungen · ${state.groups.length} Muskelgruppen · Version 2</p><button class="settings-option" id="export-data">${icon('download')}<span><strong>Daten sichern</strong><small>Übungen, Texte, Farben und Auswahl als JSON speichern.</small></span></button><button class="settings-option" id="import-data">${icon('upload')}<span><strong>Sicherung laden</strong><small>Eine vorhandene Repertoire-JSON einlesen.</small></span></button><button class="settings-option" id="export-html">${icon('copy')}<span><strong>Aktuelle App als HTML sichern</strong><small>Diese Version inklusive deiner Änderungen mitnehmen.</small></span></button><button class="settings-option" id="new-session">${icon('reset')}<span><strong>Neues Training</strong><small>Nur die Auswahl leeren. Dein Repertoire bleibt erhalten.</small></span></button><div class="info-block"><p><strong>Speicherung:</strong> ${storageOK?'Änderungen werden in diesem Browser lokal gespeichert.':'Lokaler Speicher ist nicht verfügbar. Änderungen bleiben nur in dieser Sitzung.'} Es gibt kein Konto und keine automatische Cloud-Synchronisierung. Browserdaten löschen oder ein anderer Browser kann die lokale Kopie entfernen. Regelmäßig sichern.</p><p><strong>Auf dem iPhone:</strong> Die App braucht eine Browseransicht, die JavaScript ausführt. Eine reine HTML-Dateivorschau reicht nicht. Am zuverlässigsten ist ein gehosteter Web-Link in Safari. Die App selbst lädt keine externen Bibliotheken oder Bilder.</p><p><strong>Datenschutz:</strong> Kein Tracking und keine Netzwerkübertragung durch diese App. Eine exportierte Datei enthält deine Übungstexte und Referenzwerte. Bei öffentlichem Hosting wären die eingebetteten Startdaten öffentlich lesbar; private Daten dafür vorher entfernen.</p><p><strong>Die Farben:</strong> Grobe, von dir editierbare Annahmen über Schwerpunkte. Keine gemessenen Aktivierungswerte und keine medizinische Beurteilung. Stabilisierende Mitarbeit zählt nicht automatisch wie gezieltes Training. Bei Schmerzen nicht nach einem vollen Kreis trainieren.</p><p><strong>Wenige neue Übungen:</strong> „Standardübung“ bedeutet nicht, dass du sie bereits beherrschst. „Bekannt“ ist separat editierbar. Deine Vorliebe: höchstens zwei neue Übungen pro Training.</p></div><details class="about-toggle"><summary>Grundlagen &amp; Quellen</summary><p>Die Muskelgruppen orientieren sich an üblichen anatomischen Trainingskategorien. Die Stufen 1/2/3 und ihre Überlagerung sind ein eigenes, vereinfachtes UI-Modell, nicht aus einer Studie gemessene Zahlen.</p><a class="source-link" href="https://www.acefitness.org/resources/everyone/exercise-library/" target="_blank" rel="noopener noreferrer">ACE · Übungsbibliothek und Körperregionen</a><a class="source-link" href="https://www.acefitness.org/resources/everyone/exercise-library/body-part/chest/" target="_blank" rel="noopener noreferrer">ACE · Brustübungen</a><a class="source-link" href="https://www.acefitness.org/resources/everyone/exercise-library/body-part/legs-thighs/" target="_blank" rel="noopener noreferrer">ACE · Oberschenkelübungen</a><a class="source-link" href="https://acsm.org/resistance-training-guidelines-update-2026/" target="_blank" rel="noopener noreferrer">ACSM · Krafttraining: Empfehlungen 2026</a><p>Persönliche Referenzwerte bleiben privat und können über eine lokale JSON-Sicherung importiert werden.</p></details></div></div>`;
    $('export-data').onclick=()=>download(JSON.stringify(state,null,2),'mein-repertoire-'+dateStamp()+'.json','application/json');
    $('import-data').onclick=()=>$('import-input').click();
    $('export-html').onclick=exportHTML;
    $('new-session').onclick=()=>resetSelection();show($('settings-dialog'));
  }
  function dateStamp(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('Sicherungsdatei erstellt.');}
  function exportHTML(){
    // Reconstruct a clean document. Remove runtime UI and embed validated, JSON-escaped state.
    const doc=document.documentElement.cloneNode(true);doc.querySelector('#app-main').innerHTML='';
    doc.querySelectorAll('dialog').forEach(el=>{el.removeAttribute('open');el.innerHTML='';});
    doc.querySelector('#toast').classList.remove('visible');doc.querySelector('#toast').textContent='';
    doc.querySelector('#initial-data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
    download('<!doctype html>\n'+doc.outerHTML,'mein-repertoire-'+dateStamp()+'.html','text/html;charset=utf-8');
  }
  function resetSelection(){if(!state.selected.length){notify('Die Auswahl ist bereits leer.');return;}ask('Neues Training?','Nur die ausgewählten Übungen werden abgewählt. Alle Übungen, Farben, Texte und Referenzwerte bleiben erhalten.',()=>{state.selected=[];persist();render();notify('Auswahl geleert.');},'Auswahl leeren');}
  $('import-input').onchange=async e=>{
    const file=e.target.files?.[0];e.target.value='';if(!file)return;
    try{if(file.size>2_000_000)throw Error('Die Datei ist zu groß (maximal 2 MB).');const next=validate(JSON.parse(await file.text()));ask('Sicherung laden?',`${next.exercises.length} Übungen und ${next.groups.length} Gruppen werden geladen. Deine jetzigen lokalen Daten werden ersetzt.`,()=>{state=next;search='';persist();document.querySelectorAll('dialog[open]').forEach(d=>d.close());render();notify('Sicherung geladen.');},'Daten ersetzen');}
    catch(err){notify('Import nicht möglich: '+err.message);}
  };
  // One event delegation layer prevents duplicate listeners after a live summary re-render.
  document.addEventListener('click',event=>{
    const t=event.target.closest('button,[data-segment],[data-paint]');if(!t)return;
    if(t.hasAttribute('data-close')){requestClose(t.closest('dialog'));return;}
    if(t.dataset.group){setGroup(t.dataset.group);return;}
    if(t.dataset.pickGroup){$('groups-dialog').close();setGroup(t.dataset.pickGroup);return;}
    if(t.dataset.toggle){toggleExercise(t.dataset.toggle);return;}
    if(t.dataset.edit){openExercise(t.dataset.edit);return;}
    if(t.dataset.segment){openSegment(t.dataset.segment);return;}
    if(t.dataset.detailEdit){$('segment-dialog').close();openExercise(t.dataset.detailEdit);return;}
    if(t.dataset.paint){setDraftLoad(t.dataset.paint,((draft.loads[t.dataset.paint]||0)+1)%4);return;}
    if(t.dataset.loadSegment){setDraftLoad(t.dataset.loadSegment,Number(t.dataset.level));return;}
    if(t.dataset.draftGroup){draftGroup=t.dataset.draftGroup;$('load-group').value=draftGroup;renderDraftLoads();return;}
    if(t.dataset.deleteSegment&&groupDraft.segments.length>1){groupDraft.segments=groupDraft.segments.filter(s=>s.id!==t.dataset.deleteSegment);renderGroupSegments();}
  });
  document.addEventListener('input',event=>{
    const t=event.target;
    if(t.dataset.segColor){const s=groupDraft.segments.find(s=>s.id===t.dataset.segColor);if(s){s.color=t.value;renderColorPreview();}}
    if(t.dataset.segName){const s=groupDraft.segments.find(s=>s.id===t.dataset.segName);if(s){s.name=t.value;renderColorPreview();}}
  });
  document.addEventListener('keydown',e=>{const t=e.target.closest('[data-segment],[data-paint]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
  function requestClose(d){
    if(!d)return;
    const dirty=(d.id==='exercise-dialog'&&draftInitial!==JSON.stringify(draft))||(d.id==='group-dialog'&&groupInitial!==JSON.stringify(groupDraft));
    if(dirty){ask('Änderungen verwerfen?','Deine noch nicht gespeicherten Änderungen gehen verloren.',()=>d.close(),'Verwerfen');}else d.close();
  }
  document.querySelectorAll('dialog').forEach(d=>{
    d.addEventListener('cancel',e=>{e.preventDefault();requestClose(d);});
    d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)requestClose(d);});
  });
  $('settings-btn').innerHTML=icon('sliders');$('settings-btn').onclick=openSettings;
  $('reset-selection').innerHTML=icon('reset');$('reset-selection').onclick=resetSelection;
  $('group-view-btn').onclick=()=>setView('group');$('selection-view-btn').onclick=()=>setView('overview');
  $('overview-button').onclick=()=>setView(state.view==='overview'?'group':'overview');
  render();persist();if(storageMessage)notify(storageMessage);
  // Expose only diagnostics useful for a self-contained HTML prototype, not personal data to a server.
  window.repertoireDiagnostics=()=>({groups:state.groups.length,exercises:state.exercises.length,selected:state.selected.length,storageOK,version:2});
})();
</script>
</body>
</html>
